name: Cleanup temp photos

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary meal photos
        run: |
          if [ ! -d tmp/meals ]; then
            exit 0
          fi

          rm -rf tmp/meals
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tmp/meals
          git diff --cached --quiet || git commit -m "Cleanup temporary meal photos"
          git push
