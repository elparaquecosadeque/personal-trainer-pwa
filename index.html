<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trainer">
<link rel="manifest" href="./manifest.webmanifest">
<title>Personal Trainer</title>
<style>
:root{--bg:#0b0d10;--card:#151922;--muted:#8f98a8;--text:#f5f7fb;--accent:#9ee493;--line:#252b36;--bad:#ff8a8a;--blue:#7cc7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:760px;margin:auto;padding:16px 14px 90px}header{position:sticky;top:0;z-index:3;background:linear-gradient(var(--bg) 88%,transparent);padding:8px 0 12px}h1{font-size:26px;margin:4px 0}.sub,.muted{color:var(--muted);font-size:13px}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:14px 0}.tab,.btn,.photo-btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:11px 8px;font-weight:750;text-align:center}.tab.active{border-color:var(--accent);color:var(--accent)}.panel{display:none}.panel.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0}.row{display:grid;grid-template-columns:1fr 84px 70px 62px;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.compact-row{display:block}.row:first-child{border-top:0}.day-plan summary{display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer}.meal-read{display:grid;grid-template-columns:1fr 84px;gap:8px;align-items:center;border-top:1px solid var(--line);padding:10px 0}.mini{padding:8px}.photo-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.photo-btn{display:block;background:#0f1218}.photo-btn.optional{color:var(--muted)}.photo-btn input{display:none}.media{width:72px;height:72px;object-fit:cover;border:1px solid var(--line);border-radius:10px;float:left;margin:0 10px 6px 0}.name{font-weight:800}.dose{color:var(--accent);font-size:13px;margin-top:2px}input,textarea,select{width:100%;background:#0f1218;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px;font:inherit}textarea{min-height:90px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.status{font-size:13px;color:var(--muted);line-height:1.35}.status.bad{color:var(--bad)}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:var(--muted);font-size:12px;margin:3px 4px 3px 0}.check{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:13px}.check input{width:auto}.hide{display:none}@media(max-width:520px){.tabs{grid-template-columns:repeat(2,1fr)}.grid,.actions,.photo-actions{grid-template-columns:1fr}.row{grid-template-columns:1fr 72px 64px}.row .rir{grid-column:2/4}.check{grid-column:1/4}.card{border-radius:10px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Personal Trainer</h1>
    <div class="sub" id="subtitle">PWA publica, datos privados en GitHub</div>
    <div class="tabs">
      <button class="tab active" data-tab="today">Hoy</button>
      <button class="tab" data-tab="week">Semana</button>
      <button class="tab" data-tab="food">Comida</button>
      <button class="tab" data-tab="report">Reporte</button>
      <button class="tab" data-tab="settings">Settings</button>
    </div>
  </header>

  <section id="today" class="panel active"></section>
  <section id="week" class="panel"></section>
  <section id="food" class="panel"></section>
  <section id="report" class="panel"></section>
  <section id="settings" class="panel"></section>
</div>
<script src="./app.js"></script>
</body>
</html>
