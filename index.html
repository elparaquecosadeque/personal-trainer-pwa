<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trainer">
<link rel="manifest" href="./manifest.webmanifest">
<title>Personal Trainer</title>
<style>
:root{--bg:#0b0d10;--card:#151922;--field:#0f1218;--muted:#8f98a8;--text:#f5f7fb;--accent:#9ee493;--line:#252b36;--bad:#ff8a8a;--blue:#7cc7ff;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:760px;margin:auto;padding:16px 14px 90px}header{position:sticky;top:0;z-index:3;background:linear-gradient(var(--bg) 88%,transparent);padding:8px 0 12px}h1{font-size:26px;margin:4px 0}.sub,.muted{color:var(--muted);font-size:13px}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:14px 0}.tab,.btn,.photo-btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:11px 8px;font-weight:750;text-align:center}.tab.active{border-color:var(--accent);color:var(--accent)}.panel{display:none}.panel.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0}.week-nav{display:grid;grid-template-columns:48px 1fr 48px 74px;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin:10px 0;text-align:center}.row{display:grid;grid-template-columns:1fr 84px 70px 62px;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.compact-row{display:block}.row:first-child{border-top:0}.day-plan summary{display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer}.meal-read{display:grid;grid-template-columns:1fr 84px;gap:8px;align-items:center;border-top:1px solid var(--line);padding:10px 0}.mini{padding:8px}.photo-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.photo-btn{display:block;background:var(--field)}.photo-btn.optional{color:var(--muted)}.photo-btn input{display:none}.media{width:72px;height:72px;object-fit:cover;border:1px solid var(--line);border-radius:10px;float:left;margin:0 10px 6px 0}.name{font-weight:800}.dose{color:var(--accent);font-size:13px;margin-top:2px}input,textarea,select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px;font:inherit}input::placeholder,textarea::placeholder{color:var(--muted)}textarea{min-height:90px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.status{font-size:13px;color:var(--muted);line-height:1.35}.status.bad{color:var(--bad)}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:var(--muted);font-size:12px;margin:3px 4px 3px 0}.check{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:13px}.check input{width:auto}.hide{display:none}@media(max-width:520px){.tabs{grid-template-columns:repeat(2,1fr)}.grid,.actions,.photo-actions{grid-template-columns:1fr}.week-nav{grid-template-columns:44px 1fr 44px}.week-nav [data-week-today]{grid-column:1/4}.row{grid-template-columns:1fr 72px 64px}.row .rir{grid-column:2/4}.check{grid-column:1/4}.card{border-radius:10px}}
</style>
<style>
:root[data-palette="light"]{--bg:#f6f7f9;--card:#ffffff;--field:#ffffff;--muted:#667085;--text:#151922;--accent:#226f54;--line:#d8dee8;--bad:#b42318;--blue:#175cd3;color-scheme:light}
:root[data-palette="forest"]{--bg:#0d1411;--card:#17211c;--field:#101a15;--muted:#9aa89f;--text:#f4fbf6;--accent:#8bd17c;--line:#2a3830;--bad:#ff9b8f;--blue:#8ecae6;color-scheme:dark}
.faq{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:11px;margin:10px 0}
:root[data-palette="light"] .faq{background:#f0f3f7}
.faq summary{display:flex;gap:8px;align-items:center;cursor:pointer;font-weight:750}
.faq p{margin:10px 0 0;color:var(--muted);font-size:13px;line-height:1.4}
.info-icon{display:inline-grid;place-items:center;width:20px;height:20px;border:1px solid var(--line);border-radius:50%;color:var(--accent);font-size:12px}
.edit-banner{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
:root[data-palette="light"] .edit-banner{background:#f0f3f7}
.photo-preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;margin:8px 0}
.photo-preview:empty{display:none}
.photo-preview img{width:100%;aspect-ratio:1;object-fit:cover;border:1px solid var(--line);border-radius:10px;background:var(--field)}
.time-picker{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.time-picker .muted{grid-column:1/4}
.row{grid-template-columns:1fr 76px 64px 64px 62px}
@media(max-width:520px){.row{grid-template-columns:repeat(3,1fr)}.row>div{grid-column:1/4}.row .rir{grid-column:auto}.check{grid-column:1/4}}
dialog{width:min(92vw,420px);border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dialog-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Personal Trainer</h1>
    <div class="sub" id="subtitle">PWA publica, datos privados en GitHub</div>
    <div class="tabs">
      <button class="tab active" data-tab="today" data-label="today">Hoy</button>
      <button class="tab" data-tab="week" data-label="week">Semana</button>
      <button class="tab" data-tab="food" data-label="food">Comida</button>
      <button class="tab" data-tab="report" data-label="report">Reporte</button>
      <button class="tab" data-tab="settings" data-label="settings">Settings</button>
    </div>
  </header>

  <section id="today" class="panel active"></section>
  <section id="week" class="panel"></section>
  <section id="food" class="panel"></section>
  <section id="report" class="panel"></section>
  <section id="settings" class="panel"></section>
</div>
<dialog id="unlockDialog">
  <h2 id="unlockTitle">Desbloquear datos</h2>
  <p class="status" id="unlockBody">Hay un token cifrado guardado en este dispositivo.</p>
  <label>Passphrase local<input id="unlockPassphrase" type="password" autocomplete="current-password"></label>
  <div class="dialog-actions">
    <button class="btn" id="unlockAndLoad">Desbloquear y cargar datos</button>
    <button class="btn" id="skipUnlock">Ahora no</button>
  </div>
  <div id="unlockDialogStatus" class="status"></div>
</dialog>
<script src="./app.js"></script>
<script>
(() => {
  const prompt = "procesa comidas pendientes";
  function photoPaths() {
    const paths = [];
    for (const { meal } of pendingMeals()) {
      const photos = meal.photos || {};
      for (const path of photos.before_paths || []) paths.push(path);
      if (photos.before_path) paths.push(photos.before_path);
      if (photos.after_path) paths.push(photos.after_path);
    }
    return [...new Set(paths.filter(Boolean))];
  }
  async function imageFile(path) {
    const res = await fetch(`${api(path)}?ref=${encodeURIComponent(settings.branch || "main")}`, { headers: headers() });
    if (!res.ok) throw new Error(`No pude leer ${path}: ${res.status}`);
    const entry = await res.json();
    const binary = atob(String(entry.content || "").replace(/\n/g, ""));
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
    return new File([bytes], path.split("/").pop() || "comida.jpg", { type: "image/jpeg" });
  }
  async function copyPrompt() {
    try { await navigator.clipboard.writeText(prompt); }
    catch {
      const area = document.createElement("textarea");
      area.value = prompt; area.style.position = "fixed"; area.style.opacity = "0";
      document.body.append(area); area.select(); document.execCommand("copy"); area.remove();
    }
  }
  function download(file) {
    const url = URL.createObjectURL(file); const link = document.createElement("a");
    link.href = url; link.download = file.name; document.body.append(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  async function run() {
    const status = document.getElementById("sharePendingStatus");
    const button = document.getElementById("sharePendingMeals");
    try {
      if (!token) throw new Error("Desbloquea el token en Settings primero.");
      if (!pendingMeals().length) throw new Error("No hay comidas pendientes en la semana visible.");
      button.disabled = true; status.classList.remove("bad"); status.textContent = "Preparando fotos pendientes...";
      const files = []; for (const path of photoPaths()) files.push(await imageFile(path));
      const canShareFiles = files.length > 0 && navigator.canShare?.({ files });
      if (navigator.share && (!files.length || canShareFiles)) {
        status.textContent = files.length ? `Compartiendo ${files.length} foto${files.length === 1 ? "" : "s"}...` : "Abriendo compartir...";
        await navigator.share({ title: "Procesar comidas pendientes", text: prompt, ...(files.length ? { files } : {}) });
        status.textContent = "Selecciona ChatGPT y envía el mensaje para iniciar el análisis."; return;
      }
      await copyPrompt(); files.forEach(download);
      status.textContent = files.length ? `Este navegador no comparte archivos directamente. Descargué ${files.length} foto${files.length === 1 ? "" : "s"} y copié “${prompt}”. Adjunta las fotos en ChatGPT y pega el comando.` : `Copié “${prompt}”. Ábrelo en ChatGPT y envíalo.`;
    } catch (err) {
      if (err?.name === "AbortError") status.textContent = "Compartir cancelado.";
      else { status.textContent = err.message || String(err); status.classList.add("bad"); }
    } finally { if (button) button.disabled = false; }
  }
  function install() {
    const copy = document.getElementById("copyPendingPrompt");
    if (!copy || document.getElementById("sharePendingMeals")) return;
    const button = document.createElement("button"); button.className = "btn"; button.id = "sharePendingMeals"; button.textContent = "Procesar en ChatGPT"; button.onclick = run; copy.parentElement?.append(button);
    const status = document.createElement("div"); status.id = "sharePendingStatus"; status.className = "status"; status.textContent = "Comparte las fotos pendientes como archivos reales para que ChatGPT pueda inspeccionarlas visualmente."; copy.closest(".card")?.append(status);
  }
  new MutationObserver(install).observe(document.getElementById("report"), { childList: true, subtree: true });
  install();
})();
</script>
</body>
</html>
